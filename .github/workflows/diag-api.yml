name: API diagnostic
# Temporary: checks whether GitHub runners can reach the retailer APIs.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full catalog iteration — same code path as the sync
        run: |
          pip install -q requests
          curl -s ifconfig.me; echo " <- egress IP"
          python - <<'EOF'
          import time
          import loblaw

          cats = loblaw.fetch_leaf_categories("nofrills")
          print("cats:", len(cats), "| with children:", sum(1 for c in cats if c.get("children")))

          cat, tiles, overflow = loblaw._fetch_category("nofrills", "3633", cats[0])
          print("cat0", cat["id"], "-> tiles:", len(tiles), "overflow children:", len(overflow or []))

          t0 = time.time()
          n = 0
          for prod, price in loblaw.iter_catalog("nofrills", "3633", cats):
              n += 1
          print(f"full catalog iterated: {n} products in {time.time()-t0:.0f}s")
          EOF
