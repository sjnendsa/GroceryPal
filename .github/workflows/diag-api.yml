name: API diagnostic
# Temporary: checks whether GitHub runners can reach the retailer APIs.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python (requests) probe — same code path as the sync
        run: |
          pip install -q requests
          pip show requests urllib3 | grep -E '^(Name|Version)'
          python - <<'EOF'
          import json, requests, uuid
          import loblaw

          # 1. raw POST, term search (mirrors the curl that worked)
          sess = requests.Session()
          data, total = loblaw._search_page(sess, "nofrills", "3633", "28000", 1)
          print("category search via loblaw._search_page:", "OK" if data else "FAILED", "| results:", total)

          # 2. raw request with status visibility
          body = {
            "cart": {"cartId": str(uuid.uuid4())},
            "fulfillmentInfo": {"storeId": "3633", "pickupType": "STORE", "offerType": "OG", "date": "", "timeSlot": None},
            "listingInfo": {"filters": {"category": ["28000"]}, "sort": {},
                            "pagination": {"from": 1}, "includeFiltersInResponse": False},
            "banner": "nofrills",
            "userData": {"domainUserId": str(uuid.uuid4()), "sessionId": str(uuid.uuid4())},
            "device": {"screenSize": 1358},
            "searchRelatedInfo": {"term": "", "options": [{"name": "rmp.unifiedSearchVariant", "value": "Y"}]},
          }
          r = requests.post(f"{loblaw.API}/api/v2/products/search",
                            headers=loblaw._headers("nofrills"), json=body, timeout=25)
          print("raw status:", r.status_code)
          print("raw body head:", r.text[:200].replace("\n", " "))
          EOF
