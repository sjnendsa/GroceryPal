name: API diagnostic
# Temporary: checks whether GitHub runners can reach the retailer APIs.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe retailer APIs
        run: |
          echo "== nofrills sitemap =="
          curl -s -o /dev/null -w "%{http_code}\n" "https://www.nofrills.ca/sitemap.xml" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          echo "== pcexpress search POST =="
          curl -s -o /tmp/r.json -w "%{http_code}\n" "https://api.pcexpress.ca/pcx-bff/api/v2/products/search" \
            -H "X-Apikey: C1xujSegT5j3ap3yexJjqhOfELwGKYvz" \
            -H "Content-Type: application/json" \
            -H "Accept: */*" -H "Accept-Language: en" \
            -H "X-Application-Type: Web" -H "X-Channel: web" \
            -H "Business-User-Agent: PCXWEB" -H "X-Loblaw-Tenant-Id: ONLINE_GROCERIES" \
            -H "Origin: https://www.nofrills.ca" -H "Referer: https://www.nofrills.ca/" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            --data '{"cart":{"cartId":"11111111-1111-1111-1111-111111111111"},"fulfillmentInfo":{"storeId":"3633","pickupType":"STORE","offerType":"OG","date":"","timeSlot":null},"listingInfo":{"filters":{},"sort":{},"pagination":{"from":1},"includeFiltersInResponse":false},"banner":"nofrills","userData":{"domainUserId":"22222222-2222-2222-2222-222222222222","sessionId":"33333333-3333-3333-3333-333333333333"},"device":{"screenSize":1358},"searchRelatedInfo":{"term":"milk","options":[{"name":"rmp.unifiedSearchVariant","value":"Y"}]}}'
          head -c 300 /tmp/r.json; echo
          echo "== pcexpress product detail GET =="
          curl -s -o /tmp/d.json -w "%{http_code}\n" "https://api.pcexpress.ca/pcx-bff/api/v1/products/20641267_EA?lang=en&date=$(date +%d%m%Y)&pickupType=STORE&storeId=3633&banner=nofrills" \
            -H "X-Apikey: C1xujSegT5j3ap3yexJjqhOfELwGKYvz" \
            -H "Accept: */*" -H "X-Application-Type: Web" -H "X-Channel: web" \
            -H "Business-User-Agent: PCXWEB" -H "X-Loblaw-Tenant-Id: ONLINE_GROCERIES" \
            -H "Origin: https://www.nofrills.ca" -H "Referer: https://www.nofrills.ca/" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
          head -c 300 /tmp/d.json; echo
          echo "== saveon storefrontgateway (control) =="
          curl -s -o /dev/null -w "%{http_code}\n" "https://storefrontgateway.saveonfoods.com/api/stores/1982/categories" \
            -H "X-Correlation-Id: 44444444-4444-4444-4444-444444444444" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
