name: Export static docs

# Re-bakes docs/ (the no-server dashboard) whenever scraped data or the
# dashboard source changes, so the static bundle never drifts from the app.
on:
  push:
    branches: [main]
    paths:
      - data/grocery_pal_*.db
      - templates/index.html
      - export_static.py
      - docs/static_api.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-docs
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export static bundle
        run: python3 export_static.py

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Auto-export static docs"
            for i in 1 2 3 4; do
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; sleep 15; continue; }
              git push && break
              sleep 15
            done
          fi
